<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📘 Khata Book v2</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: #eef2f3;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  }
  h1 { color: #007bff; text-align: center; }
  input, select, button {
    width: 90%;
    padding: 8px;
    margin: 8px 0;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  button {
    width: 45%;
    background: #007bff;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover { background: #0056b3; }
  .flex { display: flex; justify-content: space-between; flex-wrap: wrap; }
  ul { list-style: none; padding: 0; margin-top: 10px; }
  li {
    background: #f8f9fa;
    margin: 6px 0;
    padding: 10px;
    border-radius: 8px;
  }
  .lend { border-left: 5px solid green; }
  .borrow { border-left: 5px solid red; }
  #summary { text-align: center; margin-top: 10px; font-weight: bold; }
  #search, #filterDate { width: 45%; }
</style>
</head>
<body>
  <div class="container">
    <h1>📘 मेरा खाता बुक v2</h1>

    <div class="flex">
      <input type="text" id="name" placeholder="नाम">
      <input type="number" id="amount" placeholder="राशि (₹)">
    </div>

    <select id="type">
      <option value="lend">देना है</option>
      <option value="borrow">लेना है</option>
    </select>
    <div class="flex">
      <button onclick="addEntry()">➕ जोड़ें</button>
      <button onclick="exportPDF()">📤 Export PDF</button>
    </div>

    <div class="flex">
      <input type="text" id="search" placeholder="नाम से खोजें">
      <input type="date" id="filterDate">
    </div>

    <h3 id="summary"></h3>
    <ul id="list"></ul>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    let khata = JSON.parse(localStorage.getItem("khata")) || [];

    const list = document.getElementById("list");
    const summary = document.getElementById("summary");
    const search = document.getElementById("search");
    const filterDate = document.getElementById("filterDate");

    function updateUI() {
      list.innerHTML = "";
      let lendTotal = 0, borrowTotal = 0;
      const searchTerm = search.value.toLowerCase();
      const filter = filterDate.value;

      khata.forEach((item, index) => {
        if (
          (searchTerm === "" || item.name.toLowerCase().includes(searchTerm)) &&
          (filter === "" || item.date.startsWith(filter))
        ) {
          const li = document.createElement("li");
          li.classList.add(item.type);
          li.innerHTML = `
            <strong>${item.name}</strong> — ₹${item.amount} (${item.type === "lend" ? "देना है" : "लेना है"})
            <br><small>${item.date}</small>
            <button onclick="deleteEntry(${index})">❌</button>
          `;
          list.appendChild(li);
        }

        if (item.type === "lend") lendTotal += item.amount;
        else borrowTotal += item.amount;
      });

      summary.textContent = `कुल देना है: ₹${lendTotal} | कुल लेना है: ₹${borrowTotal}`;
      localStorage.setItem("khata", JSON.stringify(khata));
    }

    function addEntry() {
      const name = document.getElementById("name").value.trim();
      const amount = Number(document.getElementById("amount").value);
      const type = document.getElementById("type").value;

      if (name === "" || isNaN(amount) || amount <= 0) return alert("wrong");

      const date = new Date().toISOString().split("T")[0];
      khata.push({ name, amount, type, date });
      document.getElementById("name").value = "";
      document.getElementById("amount").value = "";
      updateUI();
    }

    function deleteEntry(index) {
      khata.splice(index, 1);
      updateUI();
    }

    async function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.text("📘 मेरा खाता बुक रिपोर्ट", 20, 20);
      let y = 40;
      khata.forEach(item => {
        doc.text(`${item.name} — ₹${item.amount} (${item.type}) [${item.date}]`, 20, y);
        y += 10;
      });
      doc.save("KhataBook.pdf");
    }

    search.addEventListener("input", updateUI);
    filterDate.addEventListener("change", updateUI);

    updateUI();
  </script>
</body>
</html>
